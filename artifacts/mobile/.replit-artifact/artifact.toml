kind = "mobile"
previewPath = "/mobile/"
title = "Deverdex Mobile"
description = "A companion React Native / Expo mobile app for Deverdex agency. Lets prospects browse services, view the portfolio gallery, and submit a quote request from their phone. Mirrors the web app's dark design system with teal and orange accents."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
